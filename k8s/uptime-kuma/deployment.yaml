apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: pokemon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:latest
          ports:
            - containerPort: 3001
          env:
            - name: UPTIME_KUMA_HOST
              value: "0.0.0.0"
            # Kuma sert nativement sous /status — les redirects internes (/status/dashboard) fonctionnent sans rewrite
            - name: BASE_PATH
              value: "/status"
          volumeMounts:
            - name: uptime-kuma-data
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 40
            periodSeconds: 20
      volumes:
        - name: uptime-kuma-data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
