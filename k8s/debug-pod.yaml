apiVersion: v1
kind: Pod
metadata:
  name: debug-secrets
  namespace: pokemon
spec:
  restartPolicy: Never
  containers:
    - name: debug
      image: ekinoox/pokemon-backend:latest
      imagePullPolicy: Always
      command: ["printenv", "DATABASE_URL"]
      env:
        - name: APP_ENV
          value: "prod"
        - name: APP_SECRET
          value: "test"
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: mysql-user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: mysql-password
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: mysql-database
        - name: DATABASE_URL
          value: "mysql://$(MYSQL_USER):$(MYSQL_PASSWORD)@mariadb:3306/$(MYSQL_DATABASE)?serverVersion=10.11.2-MariaDB&charset=utf8mb4"
        - name: CORS_ALLOW_ORIGIN
          value: "test"
